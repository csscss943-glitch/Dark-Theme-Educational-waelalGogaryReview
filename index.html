 إلى السحابة قد يؤثر في السلامة. الكتاب يضرب مثال القيادة الذاتية: المركبة تستخدم كاميرات ومستشعرات، ولأن التأخير قد يؤثر في السلامة، عولجت بعض البيانات محلياً بالحوسبة الطرفية لتقليل زمن الاستجابة. نفس المنطق لإنذار آلة يجب إيقافها فوراً."},{id:5,typeFull:"المقارنة",typeShort:"المقارنة",lesson:"الدرس 1-1",q:"قارن بين تجربة إضافة تعليمات فوق آلة حقيقية (واقع معزز) وتجربة تدريب داخل مصنع رقمي كامل (واقع افتراضي)",a:"من ص8: الواقع المعزز AR: تقنية تضيف أو تضع عناصر معلومات رقمية إلى مشهد من العالم الحقيقي. مثال: إضافة معلومات فوق صور حقيقية. الواقع الافتراضي VR: تقنية تضع المستخدم داخل بيئة افتراضية مولدة حاسوبياً بالكامل. الفرق الجوهري: المعزز يضيف رقمي إلى الحقيقي، بينما الافتراضي يغمر المستخدم في فضاء رقمي كامل، مثل التدريب داخل مصنع رقمي كامل."},{id:6,typeFull:"التصنيف",typeShort:"التصنيف",lesson:"الدرس 1-2",q:"صنف بين خدمة تختار صورة محفوظة (استرجاع) وخدمة تنشئ صورة جديدة (توليد)",a:"من ص14-16: الاسترجاع (مثل نظام توصية، تصنيف رسائل مزعجة): ينتمي للتعلم الآلي التقليدي، يتنبأ بالتفضيلات من بيانات السلوك السابق ويعرض التوصيات - يختار من موجود. التوليد (GenAI): أنظمة تنشئ محتوى جديد مثل النصوص والصور والصوت والبرمجيات اعتماداً على الأنماط التي تعلمتها من بيانات التدريب. مثل ChatGPT وأدوات توليد الصور. يعتمد غالبية أنظمته على التعلم العميق."},{id:7,typeFull:"الأمثلة",typeShort:"الأمثلة",lesson:"الدرس 1-1",q:"قدم مثالاً يميز بين مساعد السائق والقيادة الذاتية",a:"من ص7-8: الكتاب يميز بمستوى الأتمتة. مساعد السائق (أتمتة جزئية): تقنية تستخدم الذكاء الاصطناعي للمساعدة على قيادة المركبة، مقدار التدخل البشري يتفاوت بحسب مستوى الأتمتة. القيادة الذاتية الكاملة: تتخذ قرارها على متنها بالحوسبة الطرفية دون انتظار السحابة. هي مثال على نظام يقل فيه التدخل البشري إلى الحد الأدنى ويتحمل مسؤولية القيادة والتحكم."},{id:8,typeFull:"الترتيب",typeShort:"الترتيب",lesson:"الدرس 1-1",q:"رتب الهواتف الذكية، الحواسيب الأولى، الحوسبة السحابية، الإنترنت التجاري، وانتشار الحواسيب الشخصية",a:"من ص6-7 والتمارين ص9 الإجابة النموذجية: 1. ظهور الحواسيب الإلكترونية (الأربعينيات - الستينيات) - ENIAC 2. انتشار الحواسب الشخصية PCs (السبعينيات - الثمانينيات) 3. إتاحة الإنترنت للاستخدام التجاري وظهور الويب (التسعينيات) 4. ظهور الهواتف الذكية آيفون وغيره (العقد الأول من الألفية) 5. انتشار الحوسبة السحابية وتحليل البيانات الضخمة والذكاء الاصطناعي (من العقد الثاني من الألفية فصاعداً)"},{id:9,typeFull:"العلاقات",typeShort:"العلاقات",lesson:"الدرس 1-2",q:"ارسم علاقة الاحتواء بين الذكاء الاصطناعي والتعلم الآلي والتعلم العميق",a:"من ص15 الشكل 1.2.1: الكتاب يوضحها كـ فئات متداخلة: الذكاء الاصطناعي AI هو المجال الأوسع الذي يضم أنظمة تنفذ مهام مثل التعلم والتعرف والتنبؤ وتوليد المحتوى. التعلم الآلي ML فرع من الذكاء الاصطناعي - فرع تتعلم فيه النماذج الأنماط من البيانات بدل برمجة كل قاعدة صراحة. التعلم العميق DL أسلوب من أساليب التعلم الآلي يعتمد على شبكات عصبية متعددة الطبقات. الذكاء الاصطناعي التوليدي GenAI الحالي مبني على التعلم العميق. وهي علاقة تعليمية مبسطة وليست احتواء صارماً في كل الحالات."},{id:10,typeFull:"السبب والنتيجة",typeShort:"السبب والنتيجة",lesson:"الدرس 1-3",q:"فسر كيف يمكن أن تكون مطابقة الماضي سبباً لاستمرار الظلم في أنظمة القبول",a:"من ص26-27 التحيز الخوارزمي: يعرف بأنه نمط أو انحراف في مخرجات الذكاء الاصطناعي قد يؤدي إلى نتائج غير عادلة أو ضارة، وقد ينشأ من البيانات أو طريقة تصميم النظام أو استخدامه. السبب: بيانات التدريب متحيزة - مثلاً انعكاس نزعات تمييزية سابقة في البيانات، أو بيانات غير كافية عن فئة معينة. النتيجة: النظام يكرر هذا التحيز في أحكامه، مثل نظام توظيف يضيف فئة بصورة غير عادلة أو نظام تعرف على الوجه تقل دقته مع فئات معينة. لذا بيانات غير ممثلة = مخرجات غير عادلة."},{id:11,typeFull:"التطبيق على موقف",typeShort:"التطبيق",lesson:"الدرس 1-3",q:'ناقش جودة ترجمة خوارزمية قلبت معنى تعليمات "لا تتجاوز" إلى "تجاوز"',a:"من ص20-22 احتياطات الاستخدام: يبرع الذكاء الاصطناعي في إيجاد الأنماط وتصنيفها، والتعرف على الصور والنصوص، والاستدلال الاحتمالي والتنبؤ، لكنه قد يخطئ أو ينتج نتائج متحيزة، ويجب التحقق من مخرجاته. جودة الترجمة هنا غير مقبولة وعالية الخطورة. الكتاب يؤكد: عندما يكون أثر الخطأ مرتفعاً (مثل تعليمات سلامة)، تزداد الحاجة للإشراف البشري. لا يمكن الاعتماد وحده في قرارات تؤثر على سلامة الأشخاص وحقوقهم. يجب التحقق البشري."},{id:12,typeFull:"التحليل وتشخيص الخلل",typeShort:"التحليل",lesson:"الدرس 1-3",q:"حلل موقفاً سجل فيه المساعد الصوتي الكلمات بشكل صحيح لكنه نفذ أمراً خاطئاً",a:"من ص20: المساعد الصوتي دوره التعرف على الصوت، وفهم الأوامر، وتنفيذها. التشخيص: المشكلة ليست في التعرف على الكلام (المرحلة الأولى نجحت)، بل في فهم النية وتنفيذ الحكم. هذا يدخل ضمن مشكلة الصندوق الأسود: عندما تكون آلية الوصول إلى النتيجة غير واضحة، يصعب تقييمها واكتشاف الأخطاء أو التحيز. النظام يحتاج للذكاء الاصطناعي القابل للتفسير XAI."},{id:13,typeFull:"الاستنتاج",typeShort:"الاستنتاج",lesson:"الدرس 1-2",q:"استنتج أيهما لديه دليل أقوى على التعميم: نموذج أتقن أمثلة التدريب فقط، أم نموذج نجح في أمثلة جديدة؟",a:"من ص15-16 الفكرة: النموذج الذي يتعلم الأنماط من البيانات بهدف التنبؤ وإصدار أحكام. الاستنتاج: النموذج الذي نجح في أمثلة جديدة لم يرها أثناء التدريب لديه دليل أقوى على التعميم. أما النموذج الذي أتقن أمثلة التدريب فقط، فقد يكون حفظ البيانات (overfitting) ولم يتعلم نمطاً قابلاً للتعميم. الكتاب يشير أن التعلم العميق يعتمد على بيانات كبيرة نسبياً ليتعلم أنماطاً موثوقة."},{id:14,typeFull:"التنبؤ",typeShort:"التنبؤ",lesson:"الدرس 1-3",q:"ماذا تتوقع لتوصيات متجر إذا اشترى مستخدم هدايا لا تعكس اهتماماته الفعلية؟",a:"من ص20 نظام التوصية: هو نظام يتنبأ بالتفضيلات من بيانات السلوك السابق ويعرض التوصيات. التنبؤ: سيتنبأ النظام بتفضيلات خاطئة بناء على سلوك الهدايا، ويعرض توصيات لا تناسب المستخدم الفعلي. السبب أن النظام يبني على بيانات السلوك السابق دون تمييز نية الشراء. هذا يثير قضية خصوصية وجمع بيانات السلوك - الكتاب في ص21 يقول: خدمات الذكاء الاصطناعي غالباً تستخدم بياناتك الشخصية (ما تشاهده أو تشتريه أو تقوله)."},{id:15,typeFull:"اكتشاف الخطأ",typeShort:"اكتشاف الخطأ",lesson:"الدرس 1-3",q:'صحح العبارة: "تحديد من يثبت النظام ومن يشغله يكفي لإثبات وجود مساءلة عن قراراته"',a:"من ص27-28 المسؤولية والمساءلة: الكتاب يصحح هذا الفهم. العبارة خاطئة. المسؤولية هي تحديد أدوار وواجبات الأطراف المرتبطة بتطوير النظام وتشغيله واستخدامه (مثل المطور والجهة المشغلة والمستخدم). ولا يوجد توزيع واحد يصلح لكل السياقات. أما المساءلة فهي تحديد الجهات المسؤولة عن النظام وقراراته وآثاره، وإمكان محاسبتها وفق أدوارها. ليست مجرد تحديد من ثبّت، بل ملاحظة مهمة: القدرة على شرح القرار ليست هي المساءلة، بل تحديد من يُحاسَب على النتيجة. لذا تحديد المثبت والمشغل وحده لا يكفي."},{id:16,typeFull:"نقد الادعاءات",typeShort:"نقد الادعاء",lesson:"الدرس 1-2",q:"ناقش صحة الادعاء بأن الإجابة المولدة من الذكاء الاصطناعي صحيحة لأنها مرتبة وتذكر مراجع",a:"من ص16-17 الهلوسة: الذكاء الاصطناعي التوليدي قد ينتج نصاً يبدو معقولاً لكنه غير صحيح واقعياً (هلوسة). النقد: الادعاء خاطئ. الترتيب وذكر مراجع لا يعني الصحة. الكتاب يحذر: يجب التحقق من مخرجات الذكاء الاصطناعي التوليدي وعدم اعتماد مثال من الذاكرة دون استرجاع مصدر. المخاطرة: احتمال الحصول على معلومات غير صحيحة أو غير مدعومة. لذلك يجب التحقق من المخرجات ومصادرها."},{id:17,typeFull:"التقييم والمفاضلة",typeShort:"التقييم",lesson:"الدرس 1-1",q:"قيم اقتراح مؤسسة لاستبدال كل الحواسيب بالتقنية الكمومية لأنها أحدث",a:"من ص7-8: الحوسبة الكمومية هي نهج حوسبي يستخدم خصائص ميكانيكا الكم، وقد يوفر تفوقاً في فئات محددة من المسائل، لكنه ليس بديلاً عاماً لكل الحواسيب التقليدية. التقييم: الاقتراح غير مناسب. الكتاب يوضح: الحوسبة الكمومية متخصصة وليست أسرع في جميع أنواع الحسابات. استمرار تصغير الدوائر المتكاملة يواجه تحديات هندسية وفيزيائية (مثل التسرب والنفق الكمومي) لكن تحسين الأداء يعتمد أيضاً على تعدد الأنوية والمعالجة المتوازية. مور قانون هو ملاحظة تاريخية تصف ازدياد عدد الترانزستورات بمعدل يقارب الضعف كل عامين، وليس قانوناً فيزيائياً ثابتاً. لذا لا يُستبدل كل شيء."},{id:18,typeFull:"حل المشكلات",typeShort:"حل المشكلات",lesson:"الدرس 1-3",q:"اقترح معالجة لنظام يرفض طلبات ولا يستطيع المتاثرون فهم عوامل الرفض",a:"من ص27-28 XAI والشفافية: المشكلة هي مشكلة الصندوق الأسود وفقدان الشفافية. الحل من الكتاب: 1. استخدام أساليب الذكاء الاصطناعي القابل للتفسير XAI التي تتيح للبشر فهم العوامل التي أسهمت في وصول النظام إلى مخرج أو قرار معين. 2. تطبيق مبدأ الشفافية: إتاحة معلومات واضحة ومناسبة عن النظام واستخدامه وعملية اتخاذ القرار وحدوده. 3. تطبيق مبدأ العدالة: ضمان عدم التمييز ضد أي شخص أو مجموعة بعينها. الحل يجب أن يفحص بيانات التدريب وتمثيلها ويختبر النتائج عبر فئات مختلفة."},{id:19,typeFull:"التصميم",typeShort:"التصميم",lesson:"الدرس 1-3",q:"صمم تصوراً لخدمة تثبت الحضور دون تحويلها إلى تتبع دائم للطلاب",a:"من ص26-27 قضايا الخصوصية: الكتاب يذكر أن تطور الذكاء الاصطناعي أدى لظهور قضايا جديدة تتعلق بـ الخصوصية مثل المراقبة عبر تقنية التعرف على الوجه للكاميرات في الأماكن العامة والجمع الجماعي لبيانات السلوك. التصميم المقترح حسب المبادئ الأربعة: العدالة: لا تمييز. الشفافية: إبلاغ الطلاب بوضوح كيف يعمل النظام ومتى. حماية الخصوصية: التعامل المناسب مع المعلومات الشخصية - مثلاً المعالجة على الجهاز نفسه (حوسبة طرفية) وعدم تخزين صور، وتسجيل الحضور لحظياً فقط ثم حذف البيانات. المساءلة: تحديد المسؤول عن النظام. الفكرة تقلل المراقبة الدائمة وتحقق الغرض التعليمي فقط."},{id:20,typeFull:"تفسير البيانات",typeShort:"تفسير البيانات",lesson:"الدرس 1-1",q:"فسر نمط تضاعف عدد الترانزستورات في شريحة افتراضية (قانون مور) وهل يعني ذلك تضاعف السرعة بالضرورة؟",a:"من ص6-7: قانون مور هو الملاحظة التجريبية القائلة إن عدد الترانزستورات في الشريحة يتضاعف تقريباً كل عامين. الكتاب يؤكد: ليس قانوناً فيزيائياً ثابتاً، وهو وصف تاريخي لازدياد العدد. هل يعني تضاعف السرعة بالضرورة؟ لا. الكتاب يقول: استمر هذا الاتجاه عقوداً وأسهم في زيادة قدرات الحوسبة وتحسين أداء المعالجات، لكن استمرار تصغير مكونات الدوائر يواجه تحديات هندسية وفيزيائية مثل تيارات التسرب وتأثيرات كمومية (النفق الكمومي) مما أبطأ هذا الاتجاه. وتحسين الأداء الآن يعتمد أيضاً على تعدد الأنوية والمعالجة المتوازية وتصميمات مختلفة وليس فقط عدد الترانزستورات."},{id:21,typeFull:"التعريفات",typeShort:"التعريفات",lesson:"الدرس 1-1",q:"عرف التجارة الإلكترونية",a:"حسب ص6-7: التجارة الإلكترونية E-commerce هي بيع السلع والخدمات وشراؤها عبر الإنترنت. مثال الكتاب: متاجر إلكترونية مثل أمازون وإيباي. وهي أحد التغيرات الاجتماعية الناتجة عن تكنولوجيا المعلومات، حيث أصبحت خدمات رقمية كثيرة جزءاً من الحياة اليومية."},{id:22,typeFull:"التعريفات",typeShort:"التعريفات",lesson:"الدرس 1-1",q:"عرف الحوسبة الطرفية",a:"ص8: الحوسبة الطرفية هي معالجة البيانات فوراً على الجهاز نفسه بدلاً من إرسالها إلى السحابة. الكتاب يطبقها على القيادة الذاتية والآلات، حيث تتخذ السيارة قرارها على متنها دون انتظار السحابة لتقليل زمن الاستجابة."},{id:23,typeFull:"التعداد",typeShort:"التعداد",lesson:"الدرس 1-1",q:"اذكر الفترات الخمس لتطور تكنولوجيا المعلومات",a:"من جدول ص6-7: 1. الأربعينيات-الستينيات: ظهور الحواسيب الإلكترونية ENIAC باستخدام الصمامات المفرغة للأغراض العسكرية والعلمية. 2. السبعينيات-الثمانينيات: انتشار الحواسب الشخصية PCs وبداية استخدام الأفراد. 3. التسعينيات: إتاحة الإنترنت للاستخدام التجاري وظهور الويب وانتشار الوصول العالمي للمعلومات والبريد الإلكتروني. 4. العقد الأول من الألفية: ظهور الهواتف الذكية آيفون وغيره وانتشار الإنترنت عبر المحمول. 5. من العقد الثاني من الألفية فصاعداً: انتشار الحوسبة السحابية وتحليل البيانات الضخمة والذكاء الاصطناعي."},{id:24,typeFull:"التعداد",typeShort:"التعداد",lesson:"الدرس 1-1",q:"اذكر التغيرات الاجتماعية الخمسة",a:"ص6-7: 1. شبكات التواصل الاجتماعي SNS: منصات تتيح للمستخدمين التواصل ونشر ومشاركة المحتوى بسرعة. 2. التجارة الإلكترونية: بيع وشراء عبر الإنترنت. 3. العمل عن بُعد: نمط يؤدي فيه الشخص مهامه من المنزل أو موقع بعيد باستخدام الإنترنت. 4. التعلم عبر الإنترنت: نمط تُقدّم فيه الدروس والمواد التعليمية عبر الإنترنت. 5. الدفع غير النقدي: دفع قيمة السلع بوسائل غير نقدية مثل البطاقات المصرفية أو تطبيقات الهاتف أو رموز QR."},{id:25,typeFull:"الشرح والتفسير",typeShort:"الشرح",lesson:"الدرس 1-1",q:"اشرح لماذا ينتشر الدفع غير النقدي",a:'من ص9-10: الفائدة: سرعة الدفع، وإمكانية الدفع بدون حمل نقد. القلق: الحاجة إلى بطاقة أو هاتف ذكي، ومن لا يملك بطاقة بنكية أو هاتفاً ذكياً قد يُستبعد. الكتاب يطلب في نشاط "فكر وتوقف" تحليل احتياجات عميل صغير ليس لديه بطاقة، وتحدي الوصول والإتاحة والإنصاف.'},{id:26,typeFull:"الشرح والتفسير",typeShort:"الشرح",lesson:"الدرس 1-2",q:"اشرح ما هو الذكاء الاصطناعي التوليدي",a:"ص15: أنظمة تنشئ محتوى جديداً مثل النصوص والصور والصوت والبرمجيات اعتماداً على الأنماط التي تعلمتها من بيانات التدريب. ينشئ نصوصاً وصوراً ومقاطع صوتية جديدة. تعتمد غالبية أنظمته الحديثة على نماذج التعلم العميق. أمثلة الكتاب: ChatGPT وأدوات توليد الصور والصوت."},{id:27,typeFull:"التعليل",typeShort:"التعليل",lesson:"الدرس 1-1",q:"علل لماذا شبكات التواصل فعالة",a:"ص9 الإجابة النموذجية: لأنها خدمة تتيح للمستخدمين التواصل فيما بينهم ونشر المعلومات ومشاركتها، وهي فعالة جداً في نشر المعلومات بسرعة. طبيعتها الشبكية تسمح لكل مستخدم بالنشر وإعادة المشاركة، مما يوسع الوصول العالمي."},{id:28,typeFull:"التعليل",typeShort:"التعليل",lesson:"الدرس 1-2",q:"علل صعوبة مواجهة الذكاء الاصطناعي لشيء نادر",a:"ص15: لأن التعلم العميق يعتمد كثيراً على بيانات كبيرة نسبياً ليتعلم أنماطاً موثوقة. إذا كانت البيانات غير كافية أو غير ممثلة، تقل دقة النتائج. الكتاب في ص20 يؤكد: عندما تكون بيانات التدريب متحيزة أو غير كافية أو غير ممثلة، تكون النتائج غير دقيقة."},{id:29,typeFull:"المقارنة",typeShort:"المقارنة",lesson:"الدرس 1-1",q:"قارن بين العمل عن بُعد والتعلم عبر الإنترنت",a:"ص6: العمل عن بُعد Remote Work: نمط عمل يؤدي فيه الشخص مهامه من المنزل أو من موقع آخر بعيد باستخدام الإنترنت. التعلم عبر الإنترنت Online Learning: نمط تعليمي تُقدّم فيه الدروس والمواد التعليمية عبر الإنترنت. كلاهما يعتمد على الإنترنت، لكن الأول يخص أداء المهام الوظيفية، والثاني يخص تقديم الدروس والمواد التعليمية. كلاهما من آثار انتشار الإنترنت والهواتف الذكية."},{id:30,typeFull:"المقارنة",typeShort:"المقارنة",lesson:"الدرس 1-2",q:"قارن بين نظام التوصية والمساعد الصوتي",a:"ص19-20: نظام التوصية: يتنبأ بالتفضيلات من بيانات السلوك السابق ويعرض التوصيات. أمثلة: يوتيوب، أمازون، سبوتيفاي. المساعد الصوتي: يتعرف على الصوت، ويفهم الأوامر، وينفذها. أمثلة: سيري Siri، مساعد جوجل. الأول يتنبأ بما قد يهمك، والثاني يتفاعل مع كلامك لتنفيذ أمر."},{id:31,typeFull:"التصنيف",typeShort:"التصنيف",lesson:"الدرس 1-3",q:"صنف بين مهام يبرع فيها ومهام تتطلب حذر",a:"من ص21-22: يبرع فيها: إيجاد وتصنيف الأنماط في البيانات المعقدة مثل الصور والنصوص، والتعرف على الصور والأصوات والنصوص، وتوليد بعض أنواع المحتوى، والاستدلال الاحتمالي والتنبؤ استناداً إلى البيانات. يتطلب حذراً: القرارات ذات البعد الأخلاقي التي قد تؤدي إلى تمييز أو تحيز، التعامل مع المعلومات الشخصية والبيانات الحساسة، عندما تكون نتائجها عالية الأثر وتحديد المسؤولية، عندما تكون البيانات غير كافية أو متحيزة."},{id:32,typeFull:"التصنيف",typeShort:"التصنيف",lesson:"الدرس 1-2",q:"صنف خدمات: اقتراح فيديو، ترجمة نص، فتح الهاتف بالوجه",a:"ص19-21: اقتراح فيديو: نظام توصية. ترجمة نص: ترجمة آلية - ترجمة النص تلقائياً إلى لغات مختلفة (Google Translate, DeepL). فتح الهاتف بالوجه: التعرف على الوجه - الكشف عن وجوه الأشخاص في الصور والتعرف عليها تلقائياً."},{id:33,typeFull:"الأمثلة",typeShort:"الأمثلة",lesson:"الدرس 1-3",q:"قدم مثالاً على التصنيع والزراعة",a:"ص21: التصنيع: أتمتة فحص جودة المنتج - يكشف النظام عيوب المنتج بالصور، والصيانة التنبؤية للتنبؤ بأعطال الآلات. الزراعة: التنبؤ بموعد الحصاد، والكشف عن الآفات والأمراض - مثل نظام يميز بين صور المحاصيل السليمة والمصابة."},{id:34,typeFull:"الأمثلة",typeShort:"الأمثلة",lesson:"الدرس 1-3",q:"قدم مثالاً على تحيز خوارزمي",a:'ص26: نظام فرز طلبات التوظيف يضيّف فئة بصورة غير عادلة، أو نظام تعرف على الوجه تقل دقته مع فئات معينة. الكتاب في نشاط "استكشف" يطلب النظر إلى حالة: ذكاء اصطناعي للتعرف على الوجه أكثر عرضة لإساءة التعرف على أشخاص من بعض المجموعات العرقية مقارنة بغيرها.'},{id:35,typeFull:"الترتيب",typeShort:"الترتيب",lesson:"الدرس 1-2",q:"رتب المفاهيم: الذكاء الاصطناعي، التعلم الآلي، التعلم العميق، التوليدي",a:"ص16 الخلاصة: الذكاء الاصطناعي هو المجال الواسع؛ ويقع التعلم الآلي ضمنه، ويقع التعلم العميق ضمن التعلم الآلي، والذكاء الاصطناعي التوليدي الحالي مبني على التعلم العميق. الترتيب من الأوسع للأخص: الذكاء الاصطناعي > التعلم الآلي > التعلم العميق > الذكاء الاصطناعي التوليدي."},{id:36,typeFull:"العلاقات",typeShort:"العلاقات",lesson:"الدرس 1-2",q:"ما علاقة الشبكة العصبية بالتعلم العميق",a:"ص15: التعلم العميق أسلوب من أساليب التعلم الآلي يعتمد على شبكات عصبية متعددة الطبقات. الشبكة العصبية الاصطناعية ANN هي نموذج حاسوبي مستوحى بصورة مبسطة من فكرة ترابط العصبونات، يتكون من وحدات مترابطة تتغير أوزانها أثناء التدريب. يمكنه تعلم تمثيلات وأنماط معقدة من البيانات."},{id:37,typeFull:"السبب والنتيجة",typeShort:"السبب والنتيجة",lesson:"الدرس 1-3",q:"اشرح العلاقة: بيانات متحيزة = نتائج غير عادلة",a:"ص25-26: إذا كانت بيانات التدريب متحيزة، يمكن لنظام الذكاء الاصطناعي أن يكرر هذا التحيز في أحكامه. الأسباب الرئيسية: متحيزة بيانات التدريب، انعكاس نزعات تمييزية سابقة في البيانات، بيانات غير كافية عن سمات معينة. النتيجة: تحيز خوارزمي يؤدي إلى نتائج غير عادلة أو ضارة. الكتاب يؤكد: قد تسهم بيانات التدريب غير الممثلة أو المتحيزة في نتائج غير عادلة."},{id:38,typeFull:"التطبيق على موقف",typeShort:"التطبيق",lesson:"الدرس 1-3",q:"مكتبة تريد توصية كتب - حلل الموقف",a:'ص22-23 سؤال "طبق ما تعلمته": هذا نظام توصية - يتنبأ بالتفضيلات من بيانات السلوك السابق. ما يبرع فيه: إيجاد الأنماط في سجل الاستعارات. ما يتطلب حذر: الخصوصية - بيانات الطلاب شخصية، وجودة البيانات والتحيز - إذا كانت بيانات فئة قليلة قد تتحيز التوصيات، ووضوح المسؤولية - لا يترك القرار النهائي للذكاء وحده.'},{id:39,typeFull:"التحليل وتشخيص الخلل",typeShort:"التحليل",lesson:"الدرس 1-3",q:"حلّل موقف تشخيص طبي يخطئ مع صور قليلة لمرض نادر",a:"ص20-22: لأن دقة النتائج تتأثر عندما تكون بيانات التدريب غير كافية أو غير ممثلة أو متحيزة. النظام يحتاج بيانات كبيرة نسبياً. إذا كانت بيانات المرض النادر قليلة، يصبح التنبؤ غير دقيق. أيضاً مشكلة الصندوق الأسود: عندما يكون غير واضح كيف توصل إلى حكمه، يصعب اكتشاف الأخطاء. لذلك الكتاب يشدد في ص21: ينبغي أن يؤكد التشخيص النهائي طبيب بشري ولا يُترك للذكاء وحده."},{id:40,typeFull:"الاستنتاج",typeShort:"الاستنتاج",lesson:"الدرس 1-3",q:"استنتج أيهما يحتاج إشراف أكثر: توصية فيلم أم تشخيص طبي؟",a:"ص20-22: التشخيص الطبي يحتاج إشرافاً أكثر. القاعدة من الكتاب: تزداد الحاجة إلى الإشراف البشري كلما ارتفع أثر الخطأ أو كانت النتائج عالية الأثر وتحديد المسؤولية. توصية فيلم أثرها منخفض، بينما تشخيص مرض أثره على حياة الأشخاص وحقوقهم، ويتطلب حذراً شديداً ومراعاة العدالة والخصوصية."},{id:41,typeFull:"التنبؤ",typeShort:"التنبؤ",lesson:"الدرس 1-3",q:"تنبأ بما سيحدث إذا استخدمت مدرسة التعرف على الوجه للحضور",a:"ص27 قضايا الخصوصية: يمكن للكاميرات التعرف على الأفراد وتتبعهم في الأماكن العامة، وجمع كميات كبيرة من بيانات السلوك عبر الإنترنت. التنبؤ: ينشأ قلق بشأن الخصوصية - التحكم في البيانات الشخصية وكيفية مشاركتها. قد يخطئ النظام في التعرف على طالب، مما يثير قضية العدالة وعدم التمييز. يحتاج لموازنة بين السلامة والراحة وحماية الخصوصية."},{id:42,typeFull:"اكتشاف الخطأ",typeShort:"اكتشاف الخطأ",lesson:"الدرس 1-2",q:'صحح العبارة: "الذكاء التوليدي لا يستخدم التعلم العميق"',a:"العبارة خاطئة. الصحيح من ص15: غالبية أنظمة الذكاء الاصطناعي التوليدي الحديثة تعتمد على التعلم العميق. وهي تعتمد على نماذج التعلم العميق لتعلم الأنماط وتوليد محتوى جديد."},{id:43,typeFull:"اكتشاف الخطأ",typeShort:"اكتشاف الخطأ",lesson:"الدرس 1-2",q:'صحح العبارة: "التعلم الآلي والذكاء الاصطناعي نفس المعنى"',a:"خاطئة. ص16: الذكاء الاصطناعي مفهوم واسع، والتعلم الآلي إحدى تقنياته ضمنه. ليس نفس المعنى. الذكاء الاصطناعي يضم أنظمة تنفذ مهام التعلم والتعرف والتنبؤ، والتعلم الآلي فرع يتعلم الأنماط من البيانات."},{id:44,typeFull:"نقد الادعاءات",typeShort:"نقد الادعاء",lesson:"الدرس 1-3",q:'ناقش الادعاء: "لا توجد قضايا أخلاقية للذكاء الاصطناعي"',a:"الادعاء خاطئ حسب الوحدة كلها (ص24-30). الكتاب يخصص درساً كاملاً القضايا الأخلاقية المتعلقة بالذكاء الاصطناعي. توجد قضايا: التحيز الخوارزمي، قضايا الخصوصية (المراقبة بالوجه والجمع الجماعي لبيانات السلوك)، مشكلة الصندوق الأسود، المسؤولية والمساءلة. انتشار الذكاء يثير أسئلة عن العدالة والشفافية والخصوصية."},{id:45,typeFull:"نقد الادعاءات",typeShort:"نقد الادعاء",lesson:"الدرس 1-3",q:'ناقش الادعاء: "إذا كان القرار غير واضح لكن النتيجة صحيحة فلا مشكلة"',a:"ص27-28: هذا خطأ. الكتاب يقول: عندما تكون عملية اتخاذ القرار غير واضحة، يصعب تقييمها واكتشاف الأخطاء أو التحيز، حتى لو كانت النتيجة تبدو صحيحة. لذلك طُورت أساليب الذكاء الاصطناعي القابل للتفسير XAI التي تتيح للبشر فهم العوامل التي أسهمت في وصول النظام إلى مخرج. غياب الوضوح يمثل مشكلة حتى مع صحة النتيجة."},{id:46,typeFull:"التقييم والمفاضلة",typeShort:"التقييم",lesson:"الدرس 1-1",q:"قارن بين الحواسيب الأولى والسحابية من حيث الحجم والاستخدام",a:"ص6-7: الحواسيب الأولى كانت تملأ غرفة بأكملها واستخدمت أساساً للأغراض العسكرية والحسابات العلمية. بينما الحوسبة السحابية تقدم موارد تكنولوجيا المعلومات في صورة خدمات عبر الإنترنت، الأجهزة حقيقية في مكان حقيقي لكن الوصول إليها عالمي عبر الإنترنت. تطورت التقنيات لتصبح أصغر حجماً وأكثر انتشاراً، من أجهزة تملأ غرفة إلى خدمات متاحة على هاتف ذكي."},{id:47,typeFull:"التقييم والمفاضلة",typeShort:"التقييم",lesson:"الدرس 1-3",q:"هل يترك الأحكام الأخلاقية للذكاء الاصطناعي؟",a:"ص22: لا، لا بأس - بل لا ينبغي ترك الأحكام الأخلاقية للذكاء الاصطناعي بالكامل. الكتاب يصنف الأحكام الأخلاقية ضمن ما يتطلب الحذر عند استخدام الذكاء الاصطناعي، لأن القرارات قد تؤدي إلى تمييز أو تحيز. الحكم البشري لا يزال ضرورياً عندما يتعلق الأمر بالأخلاق والخصوصية والمسؤولية."},{id:48,typeFull:"حل المشكلات",typeShort:"حل المشكلات",lesson:"الدرس 1-3",q:"كيف تقلل تحيز نظام توظيف يميز ضد فئة؟",a:"من ص27-30 (فكر كمهندس): 1. افحص مدى تمثيل البيانات عبر فئات مختلفة (الجنس، المجموعات). 2. راجع طريقة تصميم النظام والسياق - اختيار المتغيرات، هل يوجد متغير بديل يمثل سمة محمية بشكل غير مباشر. 3. اختبر النتائج ثم طبق مبادئ: العدالة (عدم التمييز)، الشفافية (إتاحة معلومات واضحة عن النظام)، حماية الخصوصية، والمساءلة. لا يوجد توزيع واحد للمسؤولية يصلح لكل السياقات."},{id:49,typeFull:"التصميم",typeShort:"التصميم",lesson:"الدرس 1-2",q:"صمم قاعدة لاستخدام التوليدي في الواجبات المدرسية",a:'ص17 نشاط "فكر كمهندس": القاعدة المقترحة من الكتاب: السماح مع التحقق. فائدة: السرعة في توليد أفكار. مخاطرة: احتمال الحصول على معلومات غير صحيحة أو غير مدعومة (هلوسة). القاعدة: يجب التحقق من المخرجات ومصادرها، وذكر أن جزءاً منها مولد، وعدم الاعتماد عليها كإجابة نهائية. تلميح الكتاب: من المخرجات يجب التحقق لذلك مدعومة غير صحيحة أو غير معلومات.'},{id:50,typeFull:"تفسير البيانات",typeShort:"تفسير البيانات",lesson:"الدرس 1-1",q:"لماذا لا يعني انتشار السحابية اختفاء الحوسبة الطرفية؟",a:"ص7-8: الحوسبة السحابية انتشرت من العقد الثاني من الألفية لتقديم الموارد كخدمة، لكن الحوسبة الطرفية لا تزال ضرورية. التفسير: الحوسبة السحابية تعتمد على إرسال البيانات عبر الإنترنت، بينما بعض التطبيقات مثل القياد
